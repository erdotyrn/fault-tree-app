name: Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Graphviz
        run: choco install graphviz -y

      - name: Add Graphviz to PATH
        run: echo "C:\Program Files\Graphviz\bin" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Install Python dependencies
        run: pip install PyQt6 graphviz fpdf2 python-docx pyinstaller

      - name: Verify Graphviz
        run: dot -V

      - name: Build exe
        run: python build_exe.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: HOA-Analizoru-Windows
          path: dist/
